<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>APK Tools</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
    font-family: Vazirmatn, sans-serif;
    margin:0;
    background:#f5f7fa;
    color:#1f2937;
}

.header{
    text-align:center;
    padding:60px 20px;
}

.header h1{
    margin-bottom:10px;
}

.header p{
    color:#6b7280;
}

.grid{
    max-width:1000px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:24px;
    text-decoration:none;
    color:inherit;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#6b7280;
}

</style>
</head>
<body>

<div class="header">
    <h1>ابزارهای منابع انسانی</h1>
    <p>سامانه ابزارهای داخلی امن‌پردازان کویر</p>
</div>

<div class="grid">

    <a class="card" href="./salary/">
        <h3>💰 محاسبه حقوق</h3>
        <p>محاسبه حقوق پایه بر اساس خالص دریافتی</p>
    </a>

    <a class="card" href="./interview/">
        <h3>🎯 دعوت به مصاحبه</h3>
        <p>تولید متن دعوت مصاحبه</p>
    </a>

    <a class="card" href="./Daily Meeting/">
        <h3>📋 جلسات صبح</h3>
        <p>ابزار مدیریت حضور</p>
    </a>

</div>

</body>
</html>
