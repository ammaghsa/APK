<div class="container">
<div class="card">

<h1>محاسبه حقوق پایه از مبلغ خالص پرداختی</h1>

<div class="form-grid">

    <div class="field">
        <label>خالص پرداختی (ریال)</label>
        <input type="number" id="netSalary" placeholder="750000000">
    </div>

    <div class="field">
        <label>وضعیت تأهل</label>
        <select id="married">
            <option value="0">مجرد</option>
            <option value="1">متأهل</option>
        </select>
    </div>

    <div class="field">
        <label>تعداد فرزند</label>
        <input type="number" id="children" value="0">
    </div>

</div>

<button onclick="calculate()">
محاسبه
</button>

<table>
<tbody>

<tr>
    <th>دستمزد روزانه</th>
    <td id="dailyWage">-</td>
</tr>

<tr>
    <th>حقوق پایه ماهانه</th>
    <td id="baseSalary">-</td>
</tr>

<tr>
    <th>حق اولاد</th>
    <td id="childAllowance">-</td>
</tr>

<tr>
    <th>حق مسکن</th>
    <td id="housing">-</td>
</tr>

<tr>
    <th>حق تأهل</th>
    <td id="marriageAllowance">-</td>
</tr>

<tr>
    <th>بن کارگری و خواروبار</th>
    <td id="foodAllowance">-</td>
</tr>

<tr>
    <th>جمع حقوق و مزایا (ناخالص)</th>
    <td id="grossSalary">-</td>
</tr>

<tr>
    <th>بیمه سهم کارمند (۷٪)</th>
    <td id="insurance">-</td>
</tr>

<tr class="net-row">
    <th>خالص پرداختی</th>
    <td id="netResult">-</td>
</tr>

</tbody>
</table>

</div>
</div>

<script>

function formatNumber(num){
    return Math.round(num).toLocaleString('fa-IR');
}

function calculate(){

    const targetNet =
        Number(document.getElementById('netSalary').value) || 0;

    const married =
        Number(document.getElementById('married').value);

    const children =
        Number(document.getElementById('children').value) || 0;

    // مقادیر ثابت (ریال)
    const HOUSING = 30000000;
    const FOOD = 22000000;
    const MARRIAGE = married ? 5000000 : 0;
    const CHILD_ALLOWANCE = children * 16625549;

    // حقوق پایه از روی خالص
    const baseSalary =
        (
            targetNet
            - CHILD_ALLOWANCE
            - 0.93 * (HOUSING + FOOD + MARRIAGE)
        ) / 0.93;

    // دستمزد روزانه
    const dailyWage = baseSalary / 30;

    // بیمه
    const insurance =
        (baseSalary + HOUSING + FOOD + MARRIAGE) * 0.07;

    // ناخالص
    const grossSalary =
        baseSalary +
        HOUSING +
        FOOD +
        MARRIAGE +
        CHILD_ALLOWANCE;

    // خالص نهایی جهت کنترل
    const netResult =
        grossSalary - insurance;

    document.getElementById('dailyWage').innerText =
        formatNumber(dailyWage) + ' ریال';

    document.getElementById('baseSalary').innerText =
        formatNumber(baseSalary) + ' ریال';

    document.getElementById('childAllowance').innerText =
        formatNumber(CHILD_ALLOWANCE) + ' ریال';

    document.getElementById('housing').innerText =
        formatNumber(HOUSING) + ' ریال';

    document.getElementById('marriageAllowance').innerText =
        formatNumber(MARRIAGE) + ' ریال';

    document.getElementById('foodAllowance').innerText =
        formatNumber(FOOD) + ' ریال';

    document.getElementById('grossSalary').innerText =
        formatNumber(grossSalary) + ' ریال';

    document.getElementById('insurance').innerText =
        formatNumber(insurance) + ' ریال';

    document.getElementById('netResult').innerText =
        formatNumber(netResult) + ' ریال';
}

</script>
