<style id='css-variables'> :root {}</style>


<div id="meet" style="height:100vh;"></div>

<script>

const params = new URLSearchParams(window.location.search);
const roomName = params.get('room');

if (!roomName) {
    alert('room parameter not found');
    throw new Error('No room specified');
}

const domain = "meet.apk-group.net";

const TARGET_HOUR = 18;
const TARGET_MINUTE = 33;

let attendanceStarted = false;
let joinedUsers = [];


// ساخت Jitsi
const api = new JitsiMeetExternalAPI(domain, {
    roomName: roomName,
    width: "100%",
    height: "100%",
    parentNode: document.querySelector('#meet')
});


// =========================
// شروع سیستم حضور
// =========================
function startAttendance() {

    attendanceStarted = true;

    console.log("Attendance started");

    sendAttendanceList();
}


// =========================
// گرفتن ورود افراد
// =========================
api.addListener('participantJoined', (p) => {

    const name = p.displayName || "Guest";

    // ❗ اگر اسم قبلاً ثبت شده → هیچ کاری نکن
    const exists = joinedUsers.find(u => u.name === name);
    if (exists) return;

    joinedUsers.push({
        id: p.participantId,
        name: name,
        time: new Date().toLocaleTimeString()
    });

    if (attendanceStarted) {
        sendAttendanceList();
    }
});


// =========================
// چک زمان شروع
// =========================
function checkTime() {

    const now = new Date();

    const afterTarget =
        now.getHours() > TARGET_HOUR ||
        (now.getHours() === TARGET_HOUR &&
         now.getMinutes() >= TARGET_MINUTE);

    if (afterTarget && !attendanceStarted) {
        startAttendance();
    }
}

setInterval(checkTime, 10000);


// =========================
// ارسال لیست به چت
// =========================
function sendAttendanceList() {

    let message = "📋 لیست حضور:\n\n";

    joinedUsers.forEach((u, i) => {
        message += `${i + 1}. ${u.name} - ${u.time}\n`;
    });

    api.executeCommand('sendChatMessage', message, undefined);
}

</script>
