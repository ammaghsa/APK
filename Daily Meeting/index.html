<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APK GROUP Meeting</title>

    <script src="./external_api.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        html, body, input, button {
            font-family: "Vazirmatn", sans-serif;
        }

        body {
            margin: 0;
            background: #f2f3f5;
        }

        #startScreen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#f5f7fa 0%,#e4e9f2 100%);
        }

        .card {
            width: 420px;
            background: #fff;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,.10);
            text-align: center;
            direction: rtl;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        #roomInput {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #d7dce3;
            border-radius: 10px;
            outline: none;
            text-align: center;
        }

        .absent-list {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #d7dce3;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
            text-align: right;
        }

        .absent-list label {
            display: block;
            margin: 4px 0;
            cursor: pointer;
            font-size: 14px;
        }

        #joinBtn {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a84ff;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        #meet {
            height: 100vh;
            display: none;
        }
    </style>
</head>
<body>

<div id="startScreen">
    <div class="card">

        <div class="logo">APK GROUP</div>

        <div class="subtitle">نام اتاق جلسه را وارد کنید</div>

        <input id="roomInput" type="text" placeholder="مثال: Daily-Meeting" autofocus>

        <div class="absent-list" id="absentList"></div>

        <button id="joinBtn" onclick="startMeeting()">ورود به جلسه</button>

    </div>
</div>

<div id="meet"></div>

<script>

const domain = "meet.apk-group.net";

const TARGET_HOUR = 07;
const TARGET_MINUTE = 17;

let api = null;
let roomName = "";

let attendanceStarted = false;
let joinedUsers = [];

const absentNames = [
"ابوالفضل اقبالی","احسان نصر","امیرجواد آیت‌الهی","امیرمهدی قاسمی",
"هومن حبیبی","حمیدرضا ابراهیمی","خسرو خسروی","سوده ظروفچیان",
"علی چاویده","فرید انصاری","محمدرضا حاجی عزیزی",
"محمدرضا شاهی","محمدکاظم حوری","محمدهادی مسلم",
"محمدرضا زمانی","مسعود پاک آئین","مهدی سلطانی","نوید نصیری زاده",
"یوسف نصیری زاده","وجیهه نیکخواه","علی آتشگر"
];

let selectedAbsentees = [];

function buildAbsentList() {
    const container = document.getElementById("absentList");

    container.innerHTML =
        '<div style="font-weight:700;margin-bottom:8px;">🚫 لیست غایبین جلسه</div>';

    absentNames.forEach(name => {
        container.innerHTML += `
            <label>
                <input type="checkbox" value="${name}">
                ${name}
            </label>
        `;
    });
}

buildAbsentList();

function startMeeting() {

    roomName = document.getElementById("roomInput").value.trim();

    if (!roomName) {
        alert("نام اتاق را وارد کنید");
        return;
    }

    selectedAbsentees = [];

    document
        .querySelectorAll('#absentList input:checked')
        .forEach(cb => selectedAbsentees.push(cb.value));

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("meet").style.display = "block";

    api = new JitsiMeetExternalAPI(domain, {
        roomName: roomName,
        width: "100%",
        height: "100%",
        parentNode: document.querySelector('#meet')
    });

    registerEvents();
}

document.getElementById("roomInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") startMeeting();
});

function registerEvents() {

    api.addListener('participantJoined', (p) => {

        const name = p.displayName || "Guest";

        const exists = joinedUsers.find(u => u.name === name);
        if (exists) return;

        joinedUsers.push({
            id: p.participantId,
            name: name,
            time: new Date().toLocaleTimeString('fa-IR')
        });

        if (attendanceStarted) {
            sendAttendanceList();
        }
    });
}

function startAttendance() {
    attendanceStarted = true;
    sendAttendanceList();
}

function checkTime() {

    const now = new Date();

    const afterTarget =
        now.getHours() > TARGET_HOUR ||
        (now.getHours() === TARGET_HOUR &&
         now.getMinutes() >= TARGET_MINUTE);

    if (afterTarget && !attendanceStarted) {
        startAttendance();
    }
}

setInterval(checkTime, 10000);

function sendAttendanceList() {

    let message = "📋 لیست حضور\n";
    message += "━━━━━━━━━━━━━━\n\n";

    joinedUsers.forEach((u, i) => {
        message += `${i + 1}. ${u.name}\n`;
        message += `⏱ ${u.time}\n\n`;
    });

    if (selectedAbsentees.length > 0) {

        message += "━━━━━━━━━━━━━━\n\n";
        message += "🚫 غایبین با هماهنگی جلسه\n\n";

        selectedAbsentees.forEach(name => {
            message += `• ${name}\n`;
        });
    }

    api.executeCommand('sendChatMessage', message, undefined);
}

</script>

</body>
</html>
