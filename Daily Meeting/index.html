<!DOCTYPE html>
<html>
<head>
    <title>APK GROUP Meeting</title>
    <script src="./external_api.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #startScreen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: #f5f5f5;
        }

        #roomInput {
            width: 320px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #joinBtn {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        #meet {
            height: 100vh;
            display: none;
        }
    </style>
</head>

<body>

<div id="startScreen">

    <h2>APK GROUP Meeting</h2>

    <input
        id="roomInput"
        type="text"
        placeholder="نام اتاق را وارد کنید"
        autofocus
    >

    <button id="joinBtn" onclick="startMeeting()">
        ورود به جلسه
    </button>

</div>

<div id="meet"></div>

<script>

const domain = "meet.apk-group.net";

const TARGET_HOUR = 18;
const TARGET_MINUTE = 33;

let api = null;
let roomName = "";

let attendanceStarted = false;
let joinedUsers = [];


// =========================
// شروع جلسه
// =========================

function startMeeting() {

    roomName = document
        .getElementById("roomInput")
        .value
        .trim();

    if (!roomName) {
        alert("نام اتاق را وارد کنید");
        return;
    }

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("meet").style.display = "block";

    api = new JitsiMeetExternalAPI(domain, {
        roomName: roomName,
        width: "100%",
        height: "100%",
        parentNode: document.querySelector('#meet')
    });

    registerEvents();
}


// Enter روی کیبورد
document
    .getElementById("roomInput")
    .addEventListener("keydown", function(e) {

        if (e.key === "Enter") {
            startMeeting();
        }

    });


// =========================
// ثبت رویدادها
// =========================

function registerEvents() {

    api.addListener('participantJoined', (p) => {

        const name = p.displayName || "Guest";

        // اگر اسم تکراری بود
        const exists = joinedUsers.find(
            u => u.name === name
        );

        if (exists) return;

        joinedUsers.push({
            id: p.participantId,
            name: name,
            time: new Date().toLocaleTimeString()
        });

        if (attendanceStarted) {
            sendAttendanceList();
        }

    });

}


// =========================
// شروع حضور و غیاب
// =========================

function startAttendance() {

    attendanceStarted = true;

    console.log("Attendance started");

    sendAttendanceList();
}


// =========================
// چک زمان
// =========================

function checkTime() {

    const now = new Date();

    const afterTarget =
        now.getHours() > TARGET_HOUR ||
        (
            now.getHours() === TARGET_HOUR &&
            now.getMinutes() >= TARGET_MINUTE
        );

    if (afterTarget && !attendanceStarted) {

        startAttendance();

    }

}

setInterval(checkTime, 10000);


// =========================
// ارسال لیست
// =========================

function sendAttendanceList() {

    let message = "📋 لیست حضور\n";
    message += "━━━━━━━━━━━━━━\n\n";

    joinedUsers.forEach((u, i) => {

        message += `${i + 1}. ${u.name}\n`;
        message += `⏱ ${u.time}\n\n`;

    });

    api.executeCommand(
        'sendChatMessage',
        message,
        undefined
    );

}

</script>

</body>
</html>
