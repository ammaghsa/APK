<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال پیام گروهی</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            direction: rtl;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #0055aa; }
        #log {
            margin-top: 20px;
            height: 480px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
            font-size: 14px;
        }
        .success { color: #006600; }
        .error { color: #cc0000; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ارسال پیام از فایل اکسل</h2>
        
        <label>آدرس Webhook:</label>
        <input type="text" id="webhook" value="https://chat.apk-group.net/hooks/69aaeea10d2f6aa03b5d7e1e/k6MdecsuD84FnKPCt7hf8cJkMu2bQccR4rYWkjY2e5HfMD7a">
        
        <label>فایل اکسل:</label>
        <input type="file" id="excelFile" accept=".xlsx,.xls">
        
        <button onclick="sendMessages()">🚀 ارسال پیام‌ها</button>
        
        <div id="log"></div>
    </div>

    <script>
        // پراکسی Cloudflare (بهترین گزینه فعلی)
        const CORS_PROXY = "https://test.cors.workers.dev/?";

        function log(text, type = '') {
            const div = document.getElementById("log");
            const time = new Date().toLocaleTimeString('fa-IR');
            const colorClass = type === 'success' ? 'success' : (type === 'error' ? 'error' : '');
            div.innerHTML += `<b>[${time}]</b> <span class="${colorClass}">${text}</span><br>`;
            div.scrollTop = div.scrollHeight;
        }

        async function sendMessages() {
            let webhook = document.getElementById("webhook").value.trim();
            const fileInput = document.getElementById("excelFile");

            if (!webhook) return alert("Webhook را وارد کنید");
            if (!fileInput.files.length) return alert("فایل اکسل انتخاب کنید");

            const proxyUrl = CORS_PROXY + encodeURIComponent(webhook);

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: "array" });
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                    log(`✅ ${rows.length} رکورد پیدا شد`, 'success');

                    for (let i = 0; i < rows.length; i++) {
                        let username = String(rows[i].username || "").trim();
                        const message = String(rows[i].message || "").trim();

                        if (!username || !message) {
                            log(`ردیف ${i+1} رد شد (خالی)`, 'error');
                            continue;
                        }
                        if (!username.startsWith("@")) username = "@" + username;

                        try {
                            const response = await fetch(proxyUrl, {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    channel: username,
                                    text: message
                                })
                            });

                            const resultText = await response.text().catch(() => "بدون پاسخ");

                            if (response.ok) {
                                log(`✅ ${username} | ارسال موفق`, 'success');
                            } else {
                                log(`❌ ${username} | ${response.status} - ${resultText.substring(0, 150)}`, 'error');
                            }
                        } catch (err) {
                            log(`❌ ${username} | خطای اتصال: ${err.message}`, 'error');
                        }

                        await new Promise(r => setTimeout(r, 1000)); // تأخیر ۱ ثانیه
                    }
                    log("🎉 عملیات تمام شد!", 'success');
                } catch (err) {
                    log("خطای کلی: " + err.message, 'error');
                }
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
